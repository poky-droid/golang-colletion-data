name: Deploy Go API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Go application
        run: |
          go build -o matrix-api .

      - name: Deploy
        run: |
          cp matrix-api /home/abdad21/matrix-api/matrix-api