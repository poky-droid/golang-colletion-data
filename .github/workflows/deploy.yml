name: Deploy Go API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Environment
        run: |
          echo "RUNNER BERHASIL"
          whoami
          hostname
          pwd
          go version

      - name: Build Go Application
        run: |
          go build -o matrix-api .

      - name: Check Binary
        run: |
          ls -lh matrix-api
          file matrix-api